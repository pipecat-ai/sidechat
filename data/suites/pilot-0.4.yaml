  - id: class-07
    setting: study group with an AI tutor
    agent: {name: Sage, role: AI maths tutor for the study group}
    people: [Amy, Ben, Chloe]
    turns:
      - [Amy, "I still don't get why the derivative of x squared is two x.", statement_of_need]
      - [Ben, "It's the power rule, you bring the two down.", reply_to_person, [Amy]]
      - [Amy, "But why does that work?", reply_to_person, [Ben]]
      - [Ben, "Honestly, I just memorised it.", reply_to_person, [Amy]]
      - [Chloe, "Sage, can you explain why the power rule works?", name_first]
      - [Sage, "Sure. Think of x squared as the area of a square with side x. If the side grows by a tiny amount, the area grows by two thin strips, each x long."]
      - [Amy, "Oh, so the two is the two strips?", follow_up]
      - [Sage, "Exactly, two strips of length x."]
      - [Ben, "That's actually a good way to see it.", people_after_agent]
      - [Chloe, "Did you write that down?", you_to_person_after_agent]
      - [Amy, "Yeah. Can you do one for x cubed?", reply_then_request]
      - [Sage, "For x cubed, picture a cube: three thin slabs, each x by x."]
      - [Ben, "I wonder if sage would go with the pasta I'm making later.", name_word_sense]
  - id: podcast-08
