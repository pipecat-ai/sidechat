# Sidechat pilot 0.4: the pilot's conversations, labelled by guide 0.2.
#
# pilot-0.3 with 3 more kinds corrected after the committee ran on guide 0.2 (exp-004), each where
# the guide's own text decides: a follow-up asked on the speaker's behalf, a correction to music
# the agent is playing (only the agent can do it), and a command whose context (the agent setting
# the timer) is 11 turns back, outside the 8-turn window, so on what is visible it is unclear.
# Two lines the committee splits on stay as the guide labels them: game-09/12 and meeting-21/11.
# Earlier corrections are described in pilot-0.3.yaml. Labels come from sidechat/guide.py.
suite: pilot-0.4
about: The pilot conversations labelled by guide 0.2 from each line's kind
label_from: guide
use: test
agent: {name: Atlas, role: AI assistant on the call}
conversations:
  - id: standup-01
    setting: work standup on a video call
    people: [Jon, Sam, Priya]
    turns:
      - [Jon, "Okay, let's get going. Sam, where are we on the release?", question_to_named_person, [Sam]]
      - [Sam, "Build's green, we're just waiting on the security review.", reply_to_person, [Jon]]
      - [Priya, "I can chase that this afternoon.", statement]
      - [Jon, "Great. Atlas, can you note that Priya's chasing the security review?", named_after_aside]
      - [Atlas, "Noted: Priya is following up on the security review this afternoon."]
      - [Jon, "And put a reminder on it for tomorrow morning.", follow_up]
      - [Atlas, "Done. Reminder set for nine tomorrow."]
      - [Sam, "Nine's a bit early for Priya.", unclear_after_agent]
      - [Priya, "Ha. Nine is fine.", reply_to_person, [Sam]]
      - [Jon, "Anything else before we wrap?", group_question_not_for_agent]
  - id: planning-02
    setting: sprint planning on a video call
    people: [Maya, Tom, Lena]
    turns:
      - [Maya, "So the big one is the billing migration. Tom, how many points did we say?", question_to_named_person, [Tom]]
      - [Tom, "Thirteen, I think. Might be more.", reply_to_person, [Maya]]
      - [Lena, "Does anyone remember what we shipped last sprint?", group_question_not_for_agent]
      - [Maya, "Not off the top of my head.", reply_to_person, [Lena]]
      - [Lena, "Atlas would know, it's got the board.", invite]
      - [Tom, "Atlas, what did we close last sprint?", name_first]
      - [Atlas, "Last sprint you closed eleven tickets, thirty-four points. The largest was the invoice export."]
      - [Tom, "Thirty-four. Okay, so thirteen for billing is a third of it.", people_after_agent]
      - [Maya, "Is that counting the bug fixes?", unclear_after_agent]
      - [Atlas, "Yes, three of the eleven were bug fixes."]
      - [Maya, "Fine. Let's call billing thirteen and move on.", statement]
