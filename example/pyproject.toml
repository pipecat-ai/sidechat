[project]
name = "sidechat-example"
version = "0.1.0"
description = "A Pipecat voice bot for a room of people that speaks only when spoken to."
requires-python = ">=3.12"
dependencies = [
    "pipecat-ai[daily,deepgram,openai,runner,silero,webrtc]==1.16.0",
    "pipecat-sidechat",
    "python-dotenv",
]

[tool.uv.sources]
pipecat-sidechat = { path = "..", editable = true }
