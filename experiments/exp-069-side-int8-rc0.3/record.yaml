experiment_id: exp-069-side-int8-rc0.3
status: done (2026-11-20)
track: sidechat (default build speed)
what: >
  An int8 file for rc0.3's default build (side-r9-ettin-150m-s1) with the recipe exp-068 found
  (per channel, reduce_range, each layer's MLP output product in fp32), through the export's own
