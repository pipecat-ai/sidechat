  decision it enables: whether rc0.3's default build can offer int8 again (about 1.6x faster on one thread)
  token forecast: none
  Modal forecast: one 8-CPU container for about 40 minutes (dev is about 31,000 lines through int8), about $0.40
  retry cap: 0
  spend cap: n/a
  stop condition: scorecard.json and report.md in runs/side/results/exp-069-side-int8-rc0.3/
  approved by Jon on: 2026-11-20 ("run all we can so things can run overnight and we arrive at the best possible model")
forecast_usd: about $0.40
command: >
  set -a; . ./.env; set +a;
  uv run modal run --detach -m sidechat.pipeline.int8_probe::run --exp exp-069-side-int8-rc0.3 --make
results: uv run python -m sidechat.pipeline.results exp-069-side-int8-rc0.3
actual_usd: about $0.40
result:
