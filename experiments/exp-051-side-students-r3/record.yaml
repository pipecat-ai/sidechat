experiment_id: exp-051-side-students-r3
status: done (2026-11-19); actual about $13.50
track: sidechat (Phase 5, agent-1x)
what: >
  The two-tower students again (Ettin-32M and 68M, sidechat-tt-0.1, 3 epochs, 80% teacher), taught
  by side-r3-ettin-150m-s0 instead of round 6's pick. Round 6 did not beat round 3: its seeds tied on
  dev (28,666 and 28,665 of 28,959), the rule took seed 1, and seed 1 answers only 22.8% of Duplex-MPE's
  unnamed requests (round 3 38.8%, Jev 26.6%) and 0.4% of N1 outright (round 3 0.3%), though it
  meets item 9. Students copy their teacher, so this gives the gate a student of the more balanced
  model. Same corpus as exp-048 (round 6's plus gen-0.3), then exported and timed on agent-1x and
  agent-2x with the tokenizer fix. Run ids side-r6ttr3t-ettin-{32m,68m}-s0.
forecast block:
  campaign: exp-051-side-students-r3
  decision it enables: which teacher's student to ship for agent-1x
  token forecast: Jev, about 140 requests
  Modal forecast: two H100s for 50 to 80 minutes, two 8-core exports, about 6 small latency containers
  retry cap: 1 on training
  spend cap: $15
  stop condition: summary in R2
  approved by Jon on: 2026-11-19 (the agent-1x plan, in chat)
forecast_usd: about $9
command: >
  set -a; . ./.env; set +a;
  uv run modal run --detach -m sidechat.pipeline.round6::run --exp exp-051-side-students-r3 --steps students,export,latency --teacher side-r3-ettin-150m-s0 --student-tag r3t --suffix -r3t --no-short --no-export-teacher
results: uv run python -m sidechat.pipeline.results exp-051-side-students-r3
actual_usd: about $13.50
result:
  ettin-32m: "Duplex-MPE 95.63% (-1.04 against round 3), outright 0.26%, explicit T 98.7%, implicit T 10.7%, N1 outright 0.69%; Ambient 98.44%; AMI 99.99%; pilot 87.41% (+0.0); fp32 (int8 failed parity 239/283); agent-1x 7 ms short, 10 ms full history, 88 ms cold, 488 MB. 10 of 16 items (not met 4, 5, 6, 7, 9)"
  ettin-68m: "Duplex-MPE 95.79% (-0.9), outright 0.17%, explicit T 87.8% (171 of 2,000 named requests below 0.1), implicit T 19.5%, N1 outright 0.25%; Ambient 98.61%; AMI 99.99%; pilot 87.41% (+0.0); int8 shipped (295 MB); agent-1x 21 ms short, 23 ms full history, 211 ms cold, 557 MB. Passes the stated gate; 10 of 16 items (not met 4, 5, 6, 7, 9)"
  learned: "the stated gate (speed, and within a point on Duplex-MPE, AMI and the pilot) is too loose: named requests are a small share of Duplex-MPE, so the 68M passes it while answering only 87.8% of them (round 3 99.5%, Jev 99.2%). Every student keeps the teacher's quiet but loses unnamed requests (item 5)"
