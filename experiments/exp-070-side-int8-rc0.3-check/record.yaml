experiment_id: exp-070-side-int8-rc0.3-check
status: done (2026-11-20; Duplex-MPE only, the other sets in -b)
track: sidechat (default build speed)
what: >
  exp-069's int8 file for rc0.3's default build, at its own thresholds, on the test sets the gates
