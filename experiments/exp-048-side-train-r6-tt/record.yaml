  token forecast: none
  Modal forecast: two H100s for 40 to 70 minutes, then scoring at about 15 minutes
  retry cap: 1
  spend cap: $20
  stop condition: report in R2
  approved by Jon on: 2026-11-19 (the agent-1x plan and the two-tower student, in chat)
