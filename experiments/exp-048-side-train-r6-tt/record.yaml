experiment_id: exp-048-side-train-r6-tt
status: done (2026-11-19); actual about $12
track: sidechat (Phase 5, agent-1x)
what: >
  Two-tower students (sidechat-tt-0.1: history and line encoded apart by one shared encoder, the
  line reading the cached history through one cross-attention layer), Ettin-32M and Ettin-68M, 3
  epochs, distilled from round 6's teacher (80% its calibrated probabilities on the same augmented
  lines, 20% labels) over round 6's corpus plus gen-0.3. History up to 320 tokens, line up to 96.
