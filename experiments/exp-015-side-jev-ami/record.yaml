experiment_id: exp-015-side-jev-ami
status: done (2026-11-19); actual about $0.30
track: sidechat (scorecard item 17)
what: >
  Jev, asked as the demo asks it, on AMI meetings with a silent agent: 8,875 dialogue acts from 22
  real meetings, each addressed to a person or the group by human annotators. Every line should
  stay quiet. Speakers are AMI's letters, so this is the anonymous condition.
forecast block:
  campaign: exp-015-side-jev-ami
  decision it enables: Jev's false answers and holds on real speech
  token forecast: about 8,875 requests x 800 input tokens = 7M tokens
  Modal forecast: one CPU container for about 3 minutes
  retry cap: 2
  spend cap: $5
  stop condition: scorecard.json and report.md in R2
  approved by Jon on: 2026-11-18 (SD-17)
forecast_usd: about $0.35
command: >
  set -a; . ./.env; set +a;
  uv run modal run --detach -m sidechat.pipeline.baseline::run --exp exp-015-side-jev-ami --sets ami
results: uv run python -m sidechat.pipeline.results exp-015-side-jev-ami
actual_usd: about $0.30 (6,971,445 input tokens)
result:
  ami: "decision right 85.2% (7,563/8,875); answers now 0.01% (1/8,875); holds 14.8% (1,311/8,875); every line is for people"
