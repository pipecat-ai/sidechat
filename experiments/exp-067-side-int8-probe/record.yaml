experiment_id: exp-067-side-int8-probe
status: done (2026-11-20)
track: sidechat (default build speed)
what: >
  rc0.3's default build ships fp32 only: round 9's int8 kept 178 of 283 pilot decisions (round 8's
  failed too; round 3's passed). On cloud CPUs fp32 150M is about 250 ms a line on 1 vCPU (exp-033),
  so an int8 build that keeps parity matters for deployment. This probe takes side-r9-ettin-150m-s1's
  exported fp32 graph and builds int8 variants (all matrix products; leaving the heads, the MLP
  output, the MLP, attention, or the first and last layers in fp32; per tensor; reduced range; and
  each layer's MLP output alone), measuring each against fp32 on the export's own parity lines and
  its speed on one thread. A recipe that keeps parity goes into export.py for round 10's export.
forecast block:
  campaign: exp-067-side-int8-probe
  decision it enables: whether the default build can ship int8 again, and how
  token forecast: none
  Modal forecast: one 8-CPU container for about 40 minutes, about $0.40
  retry cap: 0
  spend cap: n/a
  stop condition: scorecard.json and report.md in runs/side/results/exp-067-side-int8-probe/
  approved by Jon on: 2026-11-20 ("run all we can so things can run overnight and we arrive at the best possible model")
forecast_usd: about $0.40
command: >
  set -a; . ./.env; set +a;
  uv run modal run --detach -m sidechat.pipeline.int8_probe::run --exp exp-067-side-int8-probe
results: uv run python -m sidechat.pipeline.results exp-067-side-int8-probe
actual_usd: about $0.35 (one 8-CPU container for 40 minutes)
result:
  cause: "per-channel weights: every per-channel variant keeps 173 to 230 of 283 decisions; per tensor keeps 266 and reduced range 264, with mean respond difference 0.04 against 0.32. No single layer carries it."
  speed: "int8 174 ms a line on one thread against fp32's 305 (Modal CPU)"
  next: "exp-068 combines per tensor, reduced range and the MLP output in fp32"
  report: experiments/exp-067-side-int8-probe/report.md
